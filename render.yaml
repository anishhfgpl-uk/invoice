services:
  - type: web
    runtime: node
    name: tally-relay-anish
    plan: free
    rootDir: tally-relay
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true

  - type: web
    runtime: static
    name: invoice-1
    plan: free
    rootDir: invoice-1
    buildCommand: npm install && npm run build && node scripts/publish-connector.mjs
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /invoice
        destination: /index.html
      - type: rewrite
        source: /invoice/*
        destination: /*
      - type: rewrite
        source: /*
        destination: /index.html
