services:
  - type: web
    runtime: node
    name: tally-relay-anish
    plan: free
    rootDir: tally-relay
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true

  - type: web
    runtime: static
    name: invoice-1
    rootDir: invoice-1
    buildCommand: npm install && npm run build
    staticPublishPath: dist/invoice
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    # Serve the Vite base /invoice/ build from the static publish root
