services:
  - type: web
    runtime: node
    name: tally-relay-anish
    plan: free
    rootDir: tally-relay
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true

  - type: web
    runtime: static
    name: invoice-1
    staticPublishPath: ./invoice-1
    routes:
      - type: rewrite
        source: /invoice/*
        destination: /*
      - type: rewrite
        source: /*
        destination: /index.html
