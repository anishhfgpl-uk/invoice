<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TallySync Pro - Tally Import, Ledger Ageing & GST Invoicing</title>
    <meta name="description" content="TallySync Pro - Tally import, ledger ageing, GST invoicing and sales tools." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./anish-brand.css" />
    <script>
      (() => {
        const KEY = 'tallysync_connector_url';
        const DEFAULT = 'http://127.0.0.1:9101';
        const nativeFetch = window.fetch.bind(window);
        const getBase = () => localStorage.getItem(KEY) || DEFAULT;
        const rewrite = (input) => {
          try {
            const original = typeof input === 'string' ? new URL(input, window.location.href) : new URL(input.url);
            if ((original.hostname === '127.0.0.1' || original.hostname === 'localhost') && original.port === '9000') {
              const connector = new URL(getBase());
              original.protocol = connector.protocol;
              original.hostname = connector.hostname;
              original.port = connector.port;
              return original.toString();
            }
          } catch (_) {}
          return input;
        };
        window.fetch = (input, init) => nativeFetch(rewrite(input), init);
        window.tallySync = window.tallySync || {};
        Object.defineProperty(window.tallySync, 'connectorUrl', {
          configurable: true,
          get: getBase,
          set: (value) => localStorage.setItem(KEY, String(value || DEFAULT).trim().replace(/\/$/, ''))
        });
      })();
    </script>
  </head>
  <body class="bg-slate-50 text-slate-900 antialiased font-['Plus_Jakarta_Sans',sans-serif]">
    <div id="root"></div>
    <script type="module" src="/invoice/assets/main.js"></script>
  </body>
</html>
