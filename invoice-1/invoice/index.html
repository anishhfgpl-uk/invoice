<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <title>TallySync Pro</title>

  </head>
  <body>
    <div id="root"></div>
    <script type="module" crossorigin src="/assets/index-DH1aDdmx.js"></script>
    <script src="/invoice/tally-connector.js?v=8"></script>
    <script>
      window.openTallyNow = function () {
        var modal = document.getElementById('ts-modal');
        if (modal) { modal.style.display = 'flex'; return true; }
        var button = document.getElementById('ts-connect-btn');
        if (button) { button.click(); return true; }
        window.dispatchEvent(new Event('tally-connect'));
        setTimeout(function () {
          var m = document.getElementById('ts-modal');
          var b = document.getElementById('ts-connect-btn');
          if (m) m.style.display = 'flex';
          else if (b) b.click();
        }, 300);
        return true;
      };
    </script>
  </body>
