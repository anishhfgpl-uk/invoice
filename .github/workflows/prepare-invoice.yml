name: Prepare Invoice App

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/prepare-invoice.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Inspect Tally collection function inside ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP='tallysync-pro---tally-import,-ledger-ageing-&-gst-invoicing (1).zip'
          rm -rf inspect
          mkdir inspect
          unzip -q "$ZIP" -d inspect
          python3 - <<'PY'
          from pathlib import Path
          import re
          hits=[]
          for p in Path('inspect').rglob('*'):
              if not p.is_file() or 'node_modules' in p.parts or p.suffix in {'.map'}: continue
              try: s=p.read_text(encoding='utf-8')
              except: continue
              if 'function collection' in s or 'const collection' in s or 'async function collection' in s:
                  hits.append((p,s))
          print('=== COLLECTION DEFINITIONS ===')
          for p,s in hits:
              print(f'FILE: {p}')
              for m in re.finditer(r'(?:async\s+)?function\s+collection|(?:const|let|var)\s+collection',s):
                  a=max(0,m.start()-1800); b=min(len(s),m.end()+5000)
                  print(s[a:b])
          print('=== LOAD COMPANIES ===')
          for p,s in hits:
              pass
          for p in Path('inspect').rglob('*'):
              if not p.is_file() or 'node_modules' in p.parts or p.suffix in {'.map'}: continue
              try: s=p.read_text(encoding='utf-8')
              except: continue
              if 'loadCompanies' in s:
                  print(f'FILE: {p}')
                  for m in re.finditer(r'(?:async\s+)?function\s+loadCompanies|(?:const|let|var)\s+loadCompanies',s):
                      a=max(0,m.start()-1000); b=min(len(s),m.end()+3500)
                      print(s[a:b])
          PY

      - name: Stop after inspection
        run: echo 'Inspection complete'
