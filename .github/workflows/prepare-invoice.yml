name: Prepare Invoice App

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/prepare-invoice.yml'
      - 'tally-connector/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract app
        shell: bash
        run: |
          set -e
          rm -rf app prepared.zip
          mkdir -p app
          unzip -q "tallysync-pro---tally-import,-ledger-ageing-&-gst-invoicing (1).zip" -d app
          if [ -d app/tallysync-pro ]; then
            shopt -s dotglob
            mv app/tallysync-pro/* app/
            rmdir app/tallysync-pro
          fi
          test -f app/index.html

      - name: Add Tally computer IP connector UI
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/index.html'); s=p.read_text(encoding='utf-8')
          marker='<!-- TALLYSYNC_IP_CONNECTOR -->'
          if marker not in s:
            bridge=r'''<!-- TALLYSYNC_IP_CONNECTOR -->
          <script>
          (()=>{
            const KEY='tallysync_connector_url',DEFAULT='http://127.0.0.1:9101';
            const nativeFetch=window.fetch.bind(window);
            const base=()=>localStorage.getItem(KEY)||DEFAULT;
            const rewrite=input=>{try{const u=typeof input==='string'?new URL(input,location.href):new URL(input.url);if((u.hostname==='127.0.0.1'||u.hostname==='localhost')&&u.port==='9000'){const b=new URL(base());u.protocol=b.protocol;u.hostname=b.hostname;u.port=b.port;return u.toString()}}catch(_){ }return input};
            window.fetch=(input,init)=>nativeFetch(rewrite(input),init);
            window.TallySyncConnector={get url(){return base()},set url(v){localStorage.setItem(KEY,(v||DEFAULT).trim().replace(/\/$/,''))}};
            function panel(){if(document.getElementById('ts-ip-panel'))return;const x=document.createElement('div');x.id='ts-ip-panel';x.style.cssText='position:fixed;right:18px;bottom:18px;z-index:2147483647;font-family:Arial,sans-serif';x.innerHTML=`<button id="ts-open" style="border:0;border-radius:10px;padding:10px 14px;background:#111827;color:#fff;cursor:pointer">🔗 Connect Tally</button><div id="ts-box" style="display:none;margin-top:8px;width:340px;background:#fff;border:1px solid #ddd;border-radius:12px;padding:14px;box-shadow:0 8px 30px #0003;color:#111"><b>Connect Tally Computer</b><div style="font-size:12px;margin:7px 0 10px;color:#555">Enter the IP of the computer running TallyPrime + connector.</div><input id="ts-url" style="width:100%;box-sizing:border-box;padding:9px;border:1px solid #ccc;border-radius:8px" placeholder="http://192.168.1.10:9101"><div style="display:flex;gap:8px;margin-top:9px"><button id="ts-test" style="flex:1;padding:9px;border:0;border-radius:8px">Test</button><button id="ts-save" style="flex:1;padding:9px;border:0;border-radius:8px">Save</button></div><div id="ts-status" style="font-size:12px;margin-top:9px"></div><a href="/invoice/tally-connector.zip" download style="display:block;margin-top:10px;font-size:12px">Download connector</a></div>`;document.body.appendChild(x);const inp=x.querySelector('#ts-url'),st=x.querySelector('#ts-status');inp.value=base();x.querySelector('#ts-open').onclick=()=>{const b=x.querySelector('#ts-box');b.style.display=b.style.display==='none'?'block':'none'};x.querySelector('#ts-save').onclick=()=>{window.TallySyncConnector.url=inp.value;st.textContent='✅ Saved'};x.querySelector('#ts-test').onclick=async()=>{try{const u=inp.value.trim().replace(/\/$/,'');const r=await nativeFetch(u+'/health');const d=await r.json();st.textContent=d.tally?'✅ Connector + Tally connected':'⚠️ Connector found, Tally not reachable'}catch(e){st.textContent='❌ '+e.message}}}
            if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',panel);else panel();
          })();
          </script>
          '''
            p.write_text(s.replace('</head>',bridge+'\n</head>'),encoding='utf-8')
          PY

      - name: Add connector files
        shell: bash
        run: |
          set -e
          mkdir -p app/public/tally-connector
          cp tally-connector/tally-connector.mjs app/public/tally-connector/
          cp tally-connector/start-connector.bat app/public/tally-connector/
          cat > app/public/tally-connector/README.txt <<'EOF'
          TallySync Pro connector
          Run start-connector.bat on the computer where TallyPrime is installed.
          Connector port: 9101. TallyPrime port: 9000.
          Then enter that computer's LAN IP in Connect Tally on the website.
          EOF

      - name: Build and verify
        shell: bash
        run: |
          cd app
          npm install
          npm run build
          test -f dist/index.html

      - name: Package connector download
        shell: bash
        run: |
          cd app/public
          zip -q -r tally-connector.zip tally-connector

      - name: Repack source ZIP without build artifacts
        shell: bash
        run: |
          set -e
          rm -rf app/node_modules app/dist
          cd app
          zip -q -r ../prepared.zip .
          cd ..
          mv prepared.zip "tallysync-pro---tally-import,-ledger-ageing-&-gst-invoicing (1).zip"

      - name: Commit patched ZIP
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "tallysync-pro---tally-import,-ledger-ageing-&-gst-invoicing (1).zip"
          git diff --cached --quiet && exit 0
          git commit -m "Fix invoice app package for Render"
          git pull --rebase origin main
          git push origin HEAD:main
