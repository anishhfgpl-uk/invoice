name: Prepare Invoice App

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/prepare-invoice.yml'
      - 'tally-connector/**'
      - 'relay/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch invoice ZIP with Tally connector
        shell: bash
        run: |
          set -euo pipefail
          ZIP='tallysync-pro---tally-import,-ledger-ageing-&-gst-invoicing (1).zip'
          rm -rf app prepared.zip
          mkdir app
          unzip -q "$ZIP" -d app
          if [ -d app/tallysync-pro ]; then
            shopt -s dotglob
            mv app/tallysync-pro/* app/
            rmdir app/tallysync-pro
          fi
          mkdir -p app/public/tally-connector
          cp tally-connector/tally-connector.mjs app/public/tally-connector/
          cp tally-connector/start-connector.bat app/public/tally-connector/
          cp tally-connector/safe-live.js app/public/tally-connector/
          cp tally-connector/whatsapp-ageing.js app/public/tally-connector/
          cp relay/server.mjs app/public/tally-connector/relay-server.mjs

          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/index.html')
          s = p.read_text(encoding='utf-8')
          marker = '<!-- TALLYSYNC_REMOTE_LIVE_V5 -->'
          tag = marker + '<script src="./tally-connector/safe-live.js"></script>'
          # Remove older connector injections so they cannot hide the application UI.
          import re
          s = re.sub(r'<script[^>]+src=["\']\./tally-connector/(?:live-tally|hide-old-tally|brand-fix)\.js["\'][^>]*></script>', '', s, flags=re.I)
          s = re.sub(r'<!-- TALLYSYNC_REMOTE_LIVE_V4 -->', '', s)
          if marker not in s:
              s = s.replace('</head>', tag + '</head>', 1)
          p.write_text(s, encoding='utf-8')
          PY

          # The app is published behind Cloudflare at /invoice/.
          for cfg in list(Path('app').glob('vite.config.*')):
              text = cfg.read_text(encoding='utf-8')
              if 'base:' not in text:
                  text = text.replace('defineConfig({', "defineConfig({\n  base: '/invoice/',", 1)
              else:
                  import re
                  text = re.sub(r"base:\s*['\"][^'\"]*['\"]", "base: '/invoice/'", text, count=1)
              cfg.write_text(text, encoding='utf-8')

          test -f app/public/tally-connector/safe-live.js
          grep -q 'TALLYSYNC_REMOTE_LIVE_V5' app/index.html
          rm -f "$ZIP"
          (cd app && zip -q -r "../$ZIP" .)

      - name: Commit patched ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP='tallysync-pro---tally-import,-ledger-ageing-&-gst-invoicing (1).zip'
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$ZIP"
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Restore invoice application UI'
          git push origin HEAD:main
