name: Build Render Static App

on:
  push:
    branches: [main]
    paths:
      - 'invoice-1/**'
      - 'tally-connector/live-tally.js'
      - 'tally-connector/company-list-fix.js'
      - '.github/workflows/render-build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build Vite app for Render
        shell: bash
        run: |
          set -e
          rm -rf .render-src
          cp -R invoice-1 .render-src
          cat > .render-src/index.html <<'EOF'
          <!doctype html>
          <html lang="en"><head>
          <meta charset="UTF-8" />
          <meta name="viewport" content="width=device-width, initial-scale=1.0" />
          <title>TallySync Pro - Tally Import, Ledger Ageing & GST Invoicing</title>
          </head><body>
          <div id="root"></div>
          <script type="module" src="/src/main.tsx"></script>
          </body></html>
          EOF
          cd .render-src
          npm ci
          npm run build
          cd ..

          python3 - <<'PY'
          from pathlib import Path
          import shutil
          dist=Path('.render-src/dist')
          out=Path('invoice-1')
          if not dist.exists(): raise SystemExit('Vite dist directory not created')
          keep={'src','public','package.json','package-lock.json','tsconfig.json','vite.config.ts','README.md','.env.example','.gitignore'}
          for p in list(out.iterdir()):
              if p.name not in keep:
                  shutil.rmtree(p) if p.is_dir() else p.unlink()
          for p in dist.iterdir():
              target=out/p.name
              shutil.copytree(p,target,dirs_exist_ok=True) if p.is_dir() else shutil.copy2(p,target)
          live=Path('tally-connector/live-tally.js').read_text(encoding='utf-8')
          fix=Path('tally-connector/company-list-fix.js').read_text(encoding='utf-8')
          html=(out/'index.html').read_text(encoding='utf-8')
          brand='<style>body::before{content:"ANISH TECHNOLOGIES";display:block;box-sizing:border-box;width:100%;padding:16px 12px;background:#0b1220;color:#fff;text-align:center;font:900 30px Arial;letter-spacing:3px;border-bottom:3px solid #2563eb}</style>'
          html=html.replace('</head>',brand+'\n</head>')
          inject='<script id="anish-tally-connector">\n'+live+'\n</script>\n<script id="anish-company-list-fix">\n'+fix+'\n</script>'
          html=html.replace('</body>',inject+'\n</body>')
          (out/'index.html').write_text(html,encoding='utf-8')
          PY
          rm -rf .render-src

      - name: Commit Render-ready build
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add invoice-1
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Build Render-ready TallySync app"
          git pull --rebase origin main
          git push origin HEAD:main
