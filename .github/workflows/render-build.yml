name: Build Render Static App

on:
  push:
    branches: [main]
    paths:
      - 'invoice-1/**'
      - 'tally-connector/live-tally.js'
      - 'tally-connector/company-list-fix.js'
      - 'tally-connector/company-test-hotfix.js'
      - '.github/workflows/render-build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare Render directory
        shell: bash
        run: |
          set -e
          rm -rf .render-src
          cp -R invoice-1 .render-src

          cat > .render-src/index.html <<'EOF'
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="UTF-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1.0" />
              <title>TallySync Pro</title>
            </head>
            <body>
              <div id="root"></div>
              <script type="module" src="/src/main.tsx"></script>
            </body>
          </html>
          EOF

          cd .render-src
          npm ci
          npm run build
          cd ..

          python3 - <<'PY'
          from pathlib import Path
          import shutil, re

          dist = Path('.render-src/dist')
          out = Path('invoice-1/invoice')
          if not dist.exists():
              raise SystemExit('dist missing')

          if out.exists():
              shutil.rmtree(out)
          shutil.copytree(dist, out)

          live = Path('tally-connector/live-tally.js').read_text(encoding='utf-8')
          fix = Path('tally-connector/company-list-fix.js').read_text(encoding='utf-8')
          hotfix = Path('tally-connector/company-test-hotfix.js').read_text(encoding='utf-8')
          (out / 'tally-connector.js').write_text(live + '\n' + fix + '\n' + hotfix + '\n', encoding='utf-8')

          html_path = out / 'index.html'
          html = html_path.read_text(encoding='utf-8', errors='replace')
          html = re.sub(r'(?is)<style[^>]*id=["\']anish-technologies-(?:brand|persistent-brand)[^>]*>.*?</style>\s*', '', html)
          html = re.sub(r'(?is)<style>body::before\{content:[^}]+\}</style>\s*', '', html)
          html = re.sub(r'(?is)<script[^>]*id=["\']anish-permanent-tally-connect["\'][^>]*>.*?</script>\s*', '', html)
          html = html.replace('</body>', '<script src="/invoice/tally-connector.js?v=11"></script></body>')
          html_path.write_text(html, encoding='utf-8')
          PY

          rm -rf .render-src

      - name: Commit Render-ready build
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add invoice-1/invoice
          if git diff --cached --quiet; then echo 'No Render build changes.'; exit 0; fi
          git commit -m "Rebuild invoice app with Tally company test hotfix"
          git push origin HEAD:main
