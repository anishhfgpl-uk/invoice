name: Sales Import Build Check
on:
  push:
    branches: [main]
    paths:
      - 'invoice-1/src/**'
      - 'invoice-1/vite.config.ts'
      - 'invoice-1/package.json'
      - '.github/workflows/sales-import-build-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build invoice app
        working-directory: invoice-1
        run: |
          npm ci
          npm run build
