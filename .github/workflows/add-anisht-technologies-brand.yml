name: Set Invoice Top Branding

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-anisht-technologies-brand.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  set-brand:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Inject persistent ANISH TECHNOLOGIES top brand
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import zipfile, os, re

          zpath = Path('tallysync-pro---tally-import,-ledger-ageing-&-gst-invoicing (1).zip')
          with zipfile.ZipFile(zpath, 'r') as zin:
              names = zin.namelist()
              index_name = next((n for n in names if n.rstrip('/') == 'index.html' or n.endswith('/index.html')), None)
              if not index_name:
                  raise SystemExit('index.html not found in invoice package')

              index = zin.read(index_name).decode('utf-8')

              # Remove only branding injected by earlier versions of this workflow.
              index = re.sub(r'\\s*<!-- ANISH_TECHNOLOGIES_PERSISTENT_TOP_BRAND -->.*?<!-- /ANISH_TECHNOLOGIES_PERSISTENT_TOP_BRAND -->\\s*', '\\n', index, flags=re.I | re.S)
              index = re.sub(r'<style[^>]*id=["\']anish-technologies-brand[^>]*>.*?</style>\\s*', '', index, flags=re.I | re.S)
              index = re.sub(r'<div[^>]*id=["\']anish-technologies-brand[^>]*>.*?</div>\\s*', '', index, flags=re.I | re.S)

              injection = '''<!-- ANISH_TECHNOLOGIES_PERSISTENT_TOP_BRAND -->
          <style id="anish-technologies-persistent-brand">
            body::before{
              content:"ANISH TECHNOLOGIES" !important;
              display:block !important;
              width:100% !important;
              box-sizing:border-box !important;
              padding:16px 24px !important;
              text-align:center !important;
              font-family:inherit !important;
              font-size:22px !important;
              font-weight:800 !important;
              letter-spacing:.08em !important;
              line-height:1.2 !important;
              position:relative !important;
              z-index:99999 !important;
            }
          </style>
          <!-- /ANISH_TECHNOLOGIES_PERSISTENT_TOP_BRAND -->'''

              if re.search(r'<head[^>]*>', index, flags=re.I):
                  index = re.sub(r'(<head[^>]*>)', lambda m: m.group(1) + '\\n' + injection + '\\n', index, count=1, flags=re.I)
              else:
                  index = injection + '\\n' + index

              tmp = zpath.with_suffix('.tmp.zip')
              with zipfile.ZipFile(tmp, 'w', zipfile.ZIP_DEFLATED) as zout:
                  for n in names:
                      zout.writestr(n, index.encode('utf-8') if n == index_name else zin.read(n))
          os.replace(tmp, zpath)
          PY

      - name: Commit branding update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "tallysync-pro---tally-import,-ledger-ageing-&-gst-invoicing (1).zip"
          git diff --cached --quiet && exit 0
          git commit -m "Persist ANISH TECHNOLOGIES top branding"
          git push origin HEAD:main
