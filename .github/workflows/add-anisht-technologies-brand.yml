name: Package Invoice App

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-anisht-technologies-brand.yml'
      - 'tally-connector/safe-live.js'
      - 'tally-connector/tally-connector.mjs'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package-app:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Package branding, Tally Connect and connector download
        shell: bash
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path
          import zipfile, os, re

          zpath = Path('tallysync-pro---tally-import,-ledger-ageing-&-gst-invoicing (1).zip')
          if not zpath.exists():
              raise SystemExit('Invoice ZIP not found')
          connector = Path('tally-connector/safe-live.js')
          if not connector.exists():
              raise SystemExit('tally-connector/safe-live.js not found')
          connector_ui = '''(()=>{
          function addDownload(){
            if(document.getElementById('anish-connector-download')) return;
            const a=document.createElement('a');
            a.id='anish-connector-download';
            a.href='https://github.com/anishhfgpl-uk/invoice/raw/refs/heads/main/tally-connector/tally-connector.mjs';
            a.download='anish-tally-connector.mjs';
            a.target='_blank';
            a.rel='noopener';
            a.textContent='⬇ Download Tally Connector';
            a.style.cssText='position:fixed;right:24px;bottom:78px;z-index:99999;display:block;padding:12px 18px;border:0;border-radius:12px;background:#2563eb;color:#fff;font:800 14px Arial,sans-serif;text-decoration:none;box-shadow:0 8px 25px #0003';
            document.body.appendChild(a);
          }
          if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',addDownload);else addDownload();
          })();
          '''

          with zipfile.ZipFile(zpath, 'r') as zin:
              names = zin.namelist()
              index_name = next((n for n in names if n.rstrip('/') == 'index.html' or n.endswith('/index.html')), None)
              if not index_name:
                  raise SystemExit('index.html not found in invoice package')
              files = {n: zin.read(n) for n in names}
              index = files[index_name].decode('utf-8', errors='replace')

              # Remove files and tags from earlier broken connector attempts.
              for n in list(files):
                  if n.endswith('tally-connector-live.js') or n.endswith('live-tally.js') or n.endswith('invoice-connector-ui.js'):
                      del files[n]
              index = re.sub(r'<!--\s*ANISH_REMOTE_TALLY_CONNECTOR\s*-->.*?<!--\s*/ANISH_REMOTE_TALLY_CONNECTOR\s*-->', '', index, flags=re.I|re.S)
              index = re.sub(r'<script[^>]*(?:tally-connector-live|live-tally|invoice-connector-ui)\.js[^>]*>.*?</script>\s*', '', index, flags=re.I|re.S)
              index = re.sub(r'<script[^>]*(?:data-anishtally|ANISH_REMOTE_TALLY_CONNECTOR)[^>]*>.*?</script>\s*', '', index, flags=re.I|re.S)

              # Remove literal connector fragments left by previous bad injection.
              for pat in [
                  r'(?is)try\s*\{\s*const\s+raw\s*=\s*await\s+postTally\s*\(.*?\}\s*\)\s*\(\s*\)\s*;?',
                  r'(?is)function\s+brand\s*\(\)\s*\{.*?\}\s*function\s+panel\s*\(\)',
                  r'(?is)function\s+panel\s*\(\)\s*\{.*?\}\s*if\s*\(document\.readyState',
                  r'(?is)window\.TallySyncConnector',
                  r'(?is)ts-ip-panel',
                  r'(?is)postTally\s*\(xml\)',
              ]:
                  index = re.sub(pat, '', index)

              # Remove previous branding and re-add only ANISH TECHNOLOGIES.
              index = re.sub(r'<!--\s*ANISH_TECHNOLOGIES_PERSISTENT_TOP_BRAND\s*-->.*?<!--\s*/ANISH_TECHNOLOGIES_PERSISTENT_TOP_BRAND\s*-->', '', index, flags=re.I|re.S)
              index = re.sub(r'<style[^>]*id=["\']anish-technologies-(?:brand|persistent-brand)[^>]*>.*?</style>\s*', '', index, flags=re.I|re.S)
              index = re.sub(r'<div[^>]*id=["\']anish-technologies-brand[^>]*>.*?</div>\s*', '', index, flags=re.I|re.S)

              brand = '''<!-- ANISH_TECHNOLOGIES_PERSISTENT_TOP_BRAND -->
          <style id="anish-technologies-persistent-brand">
          body::before{content:"ANISH TECHNOLOGIES" !important;display:block !important;width:100% !important;box-sizing:border-box !important;background:#0b1220 !important;color:#fff !important;text-align:center !important;padding:16px 12px !important;font-family:Arial,Helvetica,sans-serif !important;font-size:clamp(24px,4vw,38px) !important;font-weight:900 !important;letter-spacing:3px !important;line-height:1.1 !important;border-bottom:3px solid #2563eb !important;position:relative !important;z-index:2147483000 !important}
          </style>
          <!-- /ANISH_TECHNOLOGIES_PERSISTENT_TOP_BRAND -->'''
              pos = index.lower().find('</head>')
              index = (index[:pos] + brand + '\n' + index[pos:]) if pos >= 0 else brand + '\n' + index

              # Add the real connector source and a tiny UI-only download helper.
              files[index_name] = index.encode('utf-8')
              files['tally-connector/safe-live.js'] = connector.read_bytes()
              files['tally-connector/tally-connector.mjs'] = Path('tally-connector/tally-connector.mjs').read_bytes()
              files['tally-connector/invoice-connector-ui.js'] = connector_ui.encode('utf-8')
              tag = '<script src="./tally-connector/safe-live.js" defer></script><script src="./tally-connector/invoice-connector-ui.js" defer></script>'
              if '</body>' in index.lower():
                  p = index.lower().rfind('</body>')
                  files[index_name] = (index[:p] + tag + '\n' + index[p:]).encode('utf-8')

              tmp = zpath.with_suffix('.clean.tmp.zip')
              with zipfile.ZipFile(tmp, 'w', zipfile.ZIP_DEFLATED) as zout:
                  for n, data in files.items():
                      zout.writestr(n, data)
              os.replace(tmp, zpath)
          PY

      - name: Commit packaged app
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "tallysync-pro---tally-import,-ledger-ageing-&-gst-invoicing (1).zip"
          if git diff --cached --quiet; then
            echo 'No packaging changes.'
            exit 0
          fi
          git commit -m "Enable Tally Connect and connector download"
          git push origin HEAD:main
