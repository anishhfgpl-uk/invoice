name: Package Invoice App

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-anisht-technologies-brand.yml'
      - 'tally-connector/live-tally.js'
      - 'tally-connector/company-list-fix.js'
      - 'tally-connector/safe-live.js'
      - 'tally-connector/tally-connector.mjs'
      - 'tally-connector/START-TALLY-CONNECTOR.cmd'
      - 'tally-connector/BUILD_TRIGGER.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package-app:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build clean Render deploy copy
        shell: bash
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path
          import zipfile, re, shutil

          zpath = Path('tallysync-pro---tally-import,-ledger-ageing-&-gst-invoicing (1).zip')
          connector = Path('tally-connector/live-tally.js')
          company_fix = Path('tally-connector/company-list-fix.js')
          if not zpath.exists(): raise SystemExit('Invoice ZIP not found')
          if not connector.exists(): raise SystemExit('live-tally.js not found')
          if not company_fix.exists(): raise SystemExit('company-list-fix.js not found')

          tmp = Path('.render-extract')
          deploy = Path('invoice-1')
          if tmp.exists(): shutil.rmtree(tmp)
          if deploy.exists(): shutil.rmtree(deploy)
          tmp.mkdir()

          with zipfile.ZipFile(zpath, 'r') as z:
              z.extractall(tmp)

          # Pick the real application root. The ZIP may contain an extra
          # wrapper directory (for example invoice/invoice/). Prefer the
          # directory containing package.json; otherwise use index.html's
          # parent. This prevents Render from publishing invoice-1/invoice/.
          roots = [p.parent for p in tmp.rglob('package.json')]
          if roots:
              root = roots[0]
          else:
              idx = next(tmp.rglob('index.html'), None)
              if not idx: raise SystemExit('index.html not found after extraction')
              root = idx.parent

          shutil.copytree(root, deploy)
          index_path = deploy / 'index.html'
          if not index_path.exists():
              raise SystemExit(f'Render index not found: {index_path}')

          index = index_path.read_text(encoding='utf-8', errors='replace')
          # Remove old generated connector/brand injections from packaged HTML.
          index = re.sub(r'(?is)<!--\s*ANISH_REMOTE_TALLY_CONNECTOR\s*-->.*?<!--\s*/ANISH_REMOTE_TALLY_CONNECTOR\s*-->', '', index)
          index = re.sub(r'(?is)<script[^>]*(?:tally-connector-live|live-tally|invoice-connector-ui|safe-live|company-list-fix)\.js[^>]*>.*?</script>\s*', '', index)
          index = re.sub(r'(?is)<script[^>]*id=["\'](?:anish-tally-connector|anish-company-list-fix|anish-permanent-tally-connect)["\'][^>]*>.*?</script>\s*', '', index)
          index = re.sub(r'(?is)<style[^>]*id=["\']anish-technologies-(?:brand|persistent-brand)[^>]*>.*?</style>\s*', '', index)
          index = re.sub(r'(?is)<!--\s*ANISH_TECHNOLOGIES_PERSISTENT_TOP_BRAND\s*-->.*?<!--\s*/ANISH_TECHNOLOGIES_PERSISTENT_TOP_BRAND\s*-->', '', index)

          connector_js = connector.read_text(encoding='utf-8').replace('</script>', '<\\/script>')
          company_js = company_fix.read_text(encoding='utf-8').replace('</script>', '<\\/script>')
          inline = '<script id="anish-tally-connector">\n' + connector_js + '\n</script>\n<script id="anish-company-list-fix">\n' + company_js + '\n</script>'
          p = index.lower().rfind('</body>')
          index = index[:p] + inline + '\n' + index[p:] if p >= 0 else index + '\n' + inline

          index_path.write_text(index, encoding='utf-8')
          print('Render app root:', root)
          print('Render index:', index_path)
          PY

      - name: Commit packaged app and Render deploy copy
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add invoice-1
          if git diff --cached --quiet; then echo 'No packaging changes.'; exit 0; fi
          git commit -m "Fix Render app root and clean generated HTML"
          git push origin HEAD:main
