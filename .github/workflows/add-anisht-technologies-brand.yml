name: Set Invoice Top Branding

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-anisht-technologies-brand.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  set-brand:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Keep only ANISH TECHNOLOGIES at the top
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import zipfile, os, re

          zpath = Path('tallysync-pro---tally-import,-ledger-ageing-&-gst-invoicing (1).zip')
          with zipfile.ZipFile(zpath, 'r') as zin:
              names = zin.namelist()
              index_name = next((n for n in names if n.rstrip('/') == 'index.html' or n.endswith('/index.html')), None)
              if not index_name:
                  raise SystemExit('index.html not found in invoice package')

              index = zin.read(index_name).decode('utf-8')

              # Remove previously injected top-brand block.
              index = re.sub(r'<!-- ANISH_TECHNOLOGIES_TOP_BRAND -->.*?</style>\s*<div id="anish-technologies-brand">.*?</div>\s*', '', index, flags=re.I | re.S)
              index = re.sub(r'<style[^>]*id=["\']anish-technologies-brand["\'][^>]*>.*?</style>\s*', '', index, flags=re.I | re.S)
              index = re.sub(r'<div[^>]*id=["\']anish-technologies-brand["\'][^>]*>.*?</div>\s*', '', index, flags=re.I | re.S)

              # Remove the top branding text variants only.
              for text in ('ANISH TECHNOLOGIES', 'TallySync Pro • Digital Solutions', 'TallySync Pro Digital Solutions', 'TallySync Pro - Digital Solutions'):
                  index = index.replace(text, '', 1)

              # Add ANISH TECHNOLOGIES back as the only custom top brand.
              brand_style = '''<style id="anish-technologies-brand">#anish-technologies-brand{font-size:22px;font-weight:800;letter-spacing:.08em;padding:16px 24px;text-align:center}</style>'''
              brand_html = '<div id="anish-technologies-brand">ANISH TECHNOLOGIES</div>'
              if re.search(r'<body[^>]*>', index, flags=re.I):
                  index = re.sub(r'(<body[^>]*>)', r'\1' + brand_style + brand_html, index, count=1, flags=re.I)
              else:
                  index = brand_style + brand_html + index

              tmp = zpath.with_suffix('.tmp.zip')
              with zipfile.ZipFile(tmp, 'w', zipfile.ZIP_DEFLATED) as zout:
                  for n in names:
                      zout.writestr(n, index.encode('utf-8') if n == index_name else zin.read(n))
          os.replace(tmp, zpath)
          PY

      - name: Commit branding update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "tallysync-pro---tally-import,-ledger-ageing-&-gst-invoicing (1).zip"
          git diff --cached --quiet && exit 0
          git commit -m "Keep ANISH TECHNOLOGIES as top branding"
          git push origin HEAD:main
