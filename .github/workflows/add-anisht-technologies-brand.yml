name: Build Invoice App Enhancements

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-anisht-technologies-brand.yml'
      - 'tally-connector/live-tally.js'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package-app:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Inject ANISH branding and remote Tally connector UI
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import zipfile, os, re

          zpath = Path('tallysync-pro---tally-import,-ledger-ageing-&-gst-invoicing (1).zip')
          js = Path('tally-connector/live-tally.js').read_text(encoding='utf-8')

          def remove_marker(text, start, end):
              while start in text and end in text:
                  a = text.index(start)
                  b = text.index(end, a) + len(end)
                  text = text[:a] + text[b:]
              return text

          with zipfile.ZipFile(zpath, 'r') as zin:
              names = zin.namelist()
              index_name = next((n for n in names if n.rstrip('/') == 'index.html' or n.endswith('/index.html')), None)
              if not index_name:
                  raise SystemExit('index.html not found in invoice package')
              index = zin.read(index_name).decode('utf-8')

              index = remove_marker(index, '<!-- ANISH_TECHNOLOGIES_PERSISTENT_TOP_BRAND -->', '<!-- /ANISH_TECHNOLOGIES_PERSISTENT_TOP_BRAND -->')
              index = remove_marker(index, '<!-- ANISH_REMOTE_TALLY_CONNECTOR -->', '<!-- /ANISH_REMOTE_TALLY_CONNECTOR -->')
              index = re.sub(r'<style[^>]*id=["\']anish-technologies-brand[^>]*>.*?</style>\s*', '', index, flags=re.I | re.S)
              index = re.sub(r'<div[^>]*id=["\']anish-technologies-brand[^>]*>.*?</div>\s*', '', index, flags=re.I | re.S)

              brand = '''<!-- ANISH_TECHNOLOGIES_PERSISTENT_TOP_BRAND -->
          <style id="anish-technologies-persistent-brand">
          body::before{content:"ANISH TECHNOLOGIES" !important;display:block !important;width:100% !important;box-sizing:border-box !important;padding:16px 24px !important;text-align:center !important;font-family:inherit !important;font-size:22px !important;font-weight:800 !important;letter-spacing:.08em !important;line-height:1.2 !important;position:relative !important;z-index:99999 !important}
          </style>
          <!-- /ANISH_TECHNOLOGIES_PERSISTENT_TOP_BRAND -->'''
              connector = '<!-- ANISH_REMOTE_TALLY_CONNECTOR -->\n<script data-anishtally="1">' + js + '</script>\n<!-- /ANISH_REMOTE_TALLY_CONNECTOR -->'

              if '</head>' in index.lower():
                  pos = index.lower().index('</head>')
                  index = index[:pos] + brand + '\n' + index[pos:]
              else:
                  index = brand + '\n' + index

              if '</body>' in index.lower():
                  pos = index.lower().index('</body>')
                  index = index[:pos] + connector + '\n' + index[pos:]
              else:
                  index += '\n' + connector

              tmp = zpath.with_suffix('.tmp.zip')
              with zipfile.ZipFile(tmp, 'w', zipfile.ZIP_DEFLATED) as zout:
                  for n in names:
                      zout.writestr(n, index.encode('utf-8') if n == index_name else zin.read(n))
          os.replace(tmp, zpath)
          PY

      - name: Commit packaged app
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "tallysync-pro---tally-import,-ledger-ageing-&-gst-invoicing (1).zip"
          git diff --cached --quiet && exit 0
          git commit -m "Package remote Tally connector and import options"
          git push origin HEAD:main
