name: Package Invoice App

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-anisht-technologies-brand.yml'
      - 'tally-connector/safe-live.js'
      - 'tally-connector/tally-connector.mjs'
      - 'tally-connector/START-TALLY-CONNECTOR.cmd'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package-app:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Package branding and Tally Connect
        shell: bash
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path
          import zipfile, os, re

          zpath = Path('tallysync-pro---tally-import,-ledger-ageing-&-gst-invoicing (1).zip')
          connector = Path('tally-connector/safe-live.js')
          if not zpath.exists(): raise SystemExit('Invoice ZIP not found')
          if not connector.exists(): raise SystemExit('safe-live.js not found')

          with zipfile.ZipFile(zpath, 'r') as zin:
              names = zin.namelist()
              index_name = next((n for n in names if n.rstrip('/') == 'index.html' or n.endswith('/index.html')), None)
              if not index_name: raise SystemExit('index.html not found')
              files = {n: zin.read(n) for n in names}
              index = files[index_name].decode('utf-8', errors='replace')

              for n in list(files):
                  if any(n.endswith(x) for x in ('tally-connector-live.js','live-tally.js','invoice-connector-ui.js')):
                      del files[n]
              index = re.sub(r'(?is)<!--\s*ANISH_REMOTE_TALLY_CONNECTOR\s*-->.*?<!--\s*/ANISH_REMOTE_TALLY_CONNECTOR\s*-->','',index)
              index = re.sub(r'(?is)<script[^>]*(?:tally-connector-live|live-tally|invoice-connector-ui)\.js[^>]*>.*?</script>\s*','',index)
              index = re.sub(r'(?is)function\s+brand\s*\(\)\s*\{.*?function\s+panel\s*\(\)', '', index)
              index = re.sub(r'(?is)window\.TallySyncConnector.*?(?:\n|;)', '', index)

              index = re.sub(r'(?is)<!--\s*ANISH_TECHNOLOGIES_PERSISTENT_TOP_BRAND\s*-->.*?<!--\s*/ANISH_TECHNOLOGIES_PERSISTENT_TOP_BRAND\s*-->','',index)
              index = re.sub(r'(?is)<style[^>]*id=["\']anish-technologies-(?:brand|persistent-brand)[^>]*>.*?</style>\s*','',index)
              brand = '''<!-- ANISH_TECHNOLOGIES_PERSISTENT_TOP_BRAND -->
          <style id="anish-technologies-persistent-brand">
          body::before{content:"ANISH TECHNOLOGIES" !important;display:block !important;width:100% !important;box-sizing:border-box !important;background:#0b1220 !important;color:#fff !important;text-align:center !important;padding:16px 12px !important;font-family:Arial,Helvetica,sans-serif !important;font-size:clamp(24px,4vw,38px) !important;font-weight:900 !important;letter-spacing:3px !important;line-height:1.1 !important;border-bottom:3px solid #2563eb !important;position:relative !important;z-index:2147483000 !important}
          </style>
          <!-- /ANISH_TECHNOLOGIES_PERSISTENT_TOP_BRAND -->'''
              p=index.lower().find('</head>')
              index=(index[:p]+brand+'\n'+index[p:]) if p>=0 else brand+'\n'+index

              connector_js=connector.read_text(encoding='utf-8').replace('</script>','<\\/script>')
              inline='<script id="anish-tally-connector">\n'+connector_js+'\n</script>'
              p=index.lower().rfind('</body>')
              index=(index[:p]+inline+'\n'+index[p:]) if p>=0 else index+'\n'+inline

              download_js='''<script id="anish-connector-download-ui">(()=>{function f(){if(document.getElementById("anish-connector-download"))return;const a=document.createElement("a");a.id="anish-connector-download";a.href="https://github.com/anishhfgpl-uk/invoice/raw/refs/heads/main/tally-connector/START-TALLY-CONNECTOR.cmd";a.download="START-TALLY-CONNECTOR.cmd";a.target="_blank";a.rel="noopener";a.textContent="⬇ Download Tally Connector";a.style.cssText="position:fixed;right:24px;bottom:78px;z-index:99999;padding:12px 18px;border-radius:12px;background:#2563eb;color:#fff;font:800 14px Arial;text-decoration:none;box-shadow:0 8px 25px #0003";document.body.appendChild(a)}if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",f);else f()})();</script>'''
              p=index.lower().rfind('</body>')
              index=(index[:p]+download_js+'\n'+index[p:]) if p>=0 else index+'\n'+download_js

              files[index_name]=index.encode('utf-8')
              tmp=zpath.with_suffix('.clean.tmp.zip')
              with zipfile.ZipFile(tmp,'w',zipfile.ZIP_DEFLATED) as zout:
                  for n,data in files.items(): zout.writestr(n,data)
              os.replace(tmp,zpath)
          PY

      - name: Commit packaged app
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "tallysync-pro---tally-import,-ledger-ageing-&-gst-invoicing (1).zip"
          if git diff --cached --quiet; then echo 'No packaging changes.'; exit 0; fi
          git commit -m "Package office Tally connector launcher"
          git push origin HEAD:main
