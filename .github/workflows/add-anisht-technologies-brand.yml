name: Package Invoice App

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-anisht-technologies-brand.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package-app:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clean broken connector text and keep only requested branding
        shell: bash
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path
          import zipfile, os, re

          zpath = Path('tallysync-pro---tally-import,-ledger-ageing-&-gst-invoicing (1).zip')
          if not zpath.exists():
              raise SystemExit('Invoice ZIP not found')

          with zipfile.ZipFile(zpath, 'r') as zin:
              names = zin.namelist()
              index_name = next((n for n in names if n.rstrip('/') == 'index.html' or n.endswith('/index.html')), None)
              if not index_name:
                  raise SystemExit('index.html not found in invoice package')

              files = {n: zin.read(n) for n in names}
              index = files[index_name].decode('utf-8', errors='replace')

              # Remove connector files from previous attempts.
              for n in list(files):
                  if n.endswith('tally-connector-live.js') or n.endswith('live-tally.js'):
                      del files[n]

              # Remove the known injected connector script/tag/marker forms.
              index = re.sub(r'<!--\s*ANISH_REMOTE_TALLY_CONNECTOR\s*-->.*?<!--\s*/ANISH_REMOTE_TALLY_CONNECTOR\s*-->', '', index, flags=re.I|re.S)
              index = re.sub(r'<script[^>]*(?:tally-connector-live|live-tally)\.js[^>]*>.*?</script>\s*', '', index, flags=re.I|re.S)
              index = re.sub(r'<script[^>]*(?:data-anishtally|ANISH_REMOTE_TALLY_CONNECTOR)[^>]*>.*?</script>\s*', '', index, flags=re.I|re.S)

              # The previous bad build sometimes pasted the connector IIFE as literal page text.
              # Remove that exact connector payload without touching the application's own code.
              bad_start = re.search(r'(?is)try\s*\{\s*const\s+raw\s*=\s*await\s+postTally\s*\(', index)
              if bad_start:
                  bad_end = re.search(r'(?is)\}\s*\)\s*\(\s*\)\s*;?', index[bad_start.end():])
                  if bad_end:
                      end = bad_start.end() + bad_end.end()
                      index = index[:bad_start.start()] + index[end:]

              # Remove any remaining obvious fragments from that injected payload when rendered as text.
              for pat in [
                  r'(?is)function\s+brand\s*\(\)\s*\{.*?\}\s*function\s+panel\s*\(\)',
                  r'(?is)function\s+panel\s*\(\)\s*\{.*?\}\s*if\s*\(document\.readyState',
                  r'(?is)window\.TallySyncConnector',
                  r'(?is)ts-ip-panel',
                  r'(?is)postTally\s*\(xml\)',
              ]:
                  index = re.sub(pat, '', index)

              # Remove old injected brand variants, then add only the requested top name.
              index = re.sub(r'<!--\s*ANISH_TECHNOLOGIES_PERSISTENT_TOP_BRAND\s*-->.*?<!--\s*/ANISH_TECHNOLOGIES_PERSISTENT_TOP_BRAND\s*-->', '', index, flags=re.I|re.S)
              index = re.sub(r'<style[^>]*id=["\']anish-technologies-(?:brand|persistent-brand)[^>]*>.*?</style>\s*', '', index, flags=re.I|re.S)
              index = re.sub(r'<div[^>]*id=["\']anish-technologies-brand[^>]*>.*?</div>\s*', '', index, flags=re.I|re.S)

              brand = '''<!-- ANISH_TECHNOLOGIES_PERSISTENT_TOP_BRAND -->
          <style id="anish-technologies-persistent-brand">
          body::before{content:"ANISH TECHNOLOGIES" !important;display:block !important;width:100% !important;box-sizing:border-box !important;background:#0b1220 !important;color:#fff !important;text-align:center !important;padding:16px 12px !important;font-family:Arial,Helvetica,sans-serif !important;font-size:clamp(24px,4vw,38px) !important;font-weight:900 !important;letter-spacing:3px !important;line-height:1.1 !important;border-bottom:3px solid #2563eb !important;position:relative !important;z-index:2147483000 !important}
          </style>
          <!-- /ANISH_TECHNOLOGIES_PERSISTENT_TOP_BRAND -->'''

              pos = index.lower().find('</head>')
              if pos >= 0:
                  index = index[:pos] + brand + '\n' + index[pos:]
              else:
                  index = brand + '\n' + index

              files[index_name] = index.encode('utf-8')

              tmp = zpath.with_suffix('.clean.tmp.zip')
              with zipfile.ZipFile(tmp, 'w', zipfile.ZIP_DEFLATED) as zout:
                  for n, data in files.items():
                      zout.writestr(n, data)
              os.replace(tmp, zpath)
          PY

      - name: Commit packaged app
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "tallysync-pro---tally-import,-ledger-ageing-&-gst-invoicing (1).zip"
          if git diff --cached --quiet; then
            echo 'No packaging changes.'
            exit 0
          fi
          git commit -m "Clean literal Tally connector code from invoice package"
          git push origin HEAD:main
