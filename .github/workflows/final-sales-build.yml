name: Final Sales Import Build
on:
  push:
    branches: [main]
    paths:
      - 'invoice-1/src/**'
      - 'invoice-1/package.json'
      - 'invoice-1/package-lock.json'
      - 'invoice-1/vite.config.ts'
      - '.github/workflows/final-sales-build.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: invoice-1/package-lock.json
      - name: Build and publish static invoice app
        working-directory: invoice-1
        run: |
          set -e
          npm ci
          npm run build
          rm -rf invoice
          cp -R dist invoice
          cd ..
          node - <<'NODE'
          const fs = require('fs');
          const path = 'invoice-1/invoice';
          const live = fs.readFileSync('tally-connector/live-tally.js', 'utf8');
          const fix = fs.readFileSync('tally-connector/company-list-fix.js', 'utf8');
          const hotfix = fs.readFileSync('tally-connector/company-test-hotfix.js', 'utf8');
          fs.writeFileSync(`${path}/tally-connector.js`, `${live}\n${fix}\n${hotfix}\n`, 'utf8');
          const indexPath = `${path}/index.html`;
          let html = fs.readFileSync(indexPath, 'utf8');
          html = html.replace(/\/invoice\/tally-connector\.js\?v=\d+/g, '/invoice/tally-connector.js?v=16');
          if (!html.includes('/invoice/tally-connector.js?v=16')) html = html.replace('</body>', '<script src="/invoice/tally-connector.js?v=16"></script></body>');
          fs.writeFileSync(indexPath, html, 'utf8');
          NODE
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add invoice-1/invoice
          if git diff --cached --quiet; then echo 'No generated build changes.'; exit 0; fi
          git commit -m "Publish working Sales Import build"
          git push origin HEAD:main
