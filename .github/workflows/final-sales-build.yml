name: Final Sales Import Build
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: invoice-1/package-lock.json
      - name: Build
        working-directory: invoice-1
        run: |
          npm ci
          npm run build
